name: content

# Runs only when curriculum content or its generator changes.
on:
  pull_request:
    paths:
      - "content/**"
      - ".github/workflows/content.yml"
  push:
    branches: [main]
    paths:
      - "content/**"
      - ".github/workflows/content.yml"

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curriculum:
    name: curriculum generator check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The generator fails on any broken lesson/note/challenge link; the diff
      # fails if the committed curriculum.json is stale.
      - name: Regenerate curriculum and compare
        run: |
          python3 content/tools/gen_curriculum.py "$RUNNER_TEMP/curriculum.json"
          diff -u content/curriculum.json "$RUNNER_TEMP/curriculum.json"
