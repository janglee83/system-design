name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: full test suite (dev container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The same container developers use locally; every command runs through ./dev.
      - name: Build dev image
        run: docker compose build dev

      - name: Install JS dependencies
        run: ./dev pnpm install --frozen-lockfile

      # Rust tests, fmt, clippy (native + wasm), generated-type freshness,
      # wasm build + TS tests, perf budget, offline parity.
      - name: Run full test suite
        run: ./dev pnpm test

  content:
    name: curriculum generator check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The generator fails on any broken lesson/note/challenge link; the diff
      # fails if the committed curriculum.json is stale.
      - name: Regenerate curriculum and compare
        run: |
          python3 content/tools/gen_curriculum.py "$RUNNER_TEMP/curriculum.json"
          diff -u content/curriculum.json "$RUNNER_TEMP/curriculum.json"
