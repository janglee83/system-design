name: engine

# Runs only when engine code, fixtures, tooling or the build setup change.
on:
  pull_request:
    paths:
      - "crates/**"
      - "packages/**"
      - "fixtures/**"
      - "tools/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "dev"
      - ".github/workflows/engine.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/**"
      - "fixtures/**"
      - "tools/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "dev"
      - ".github/workflows/engine.yml"

# The jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: engine test suite (dev container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The same container developers use locally; every command runs through ./dev.
      # Cached layers (shared with the web workflow); the image includes Chromium since R4.
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image (layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: system-design-dev:2
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,mode=max,scope=dev-image

      - name: Install JS dependencies
        run: ./dev pnpm install --frozen-lockfile

      # Rust tests, fmt, clippy (native + wasm), generated-type freshness (sim + content),
      # wasm build + TS tests, perf budget, offline parity, content validation.
      - name: Run full test suite
        run: ./dev pnpm test
