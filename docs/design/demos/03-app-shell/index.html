<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 · Khung ứng dụng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/demo.css">
<link rel="stylesheet" href="../shared/nodes.css">
<link rel="stylesheet" href="../shared/app.css">
</head>
<body>
<main class="stage">
  <div class="shell-frame"><div id="app" class="app"></div></div>
  <p style="max-width:900px;color:var(--text-2);font-size:13px;margin:16px auto 0">Khung ứng dụng ở 1440×800. Thành phần trên khung vẽ dùng kiểu đang chọn ở demo 01, màu theo bảng đang chọn ở demo 02. Bấm <b>Đang chạy</b> để xem nút Chạy biến thành tiến độ + Dừng, bảng thành phần thu gọn, và thanh phát lại xuất hiện.</p>
</main>
<script src="../shared/art.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/nodes.js"></script>
<script src="../shared/demo.js"></script>
<script>
const I = {
  undo: '<path d="M6 4L3 7l3 3M3.5 7H10a3.5 3.5 0 0 1 0 7H8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
  redo: '<path d="M10 4l3 3-3 3M12.5 7H6a3.5 3.5 0 0 0 0 7h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
  play: '<path d="M5 3.5v9l7.5-4.5z" fill="currentColor"/>',
  pause: '<rect x="4" y="3.5" width="2.8" height="9" rx=".8" fill="currentColor"/><rect x="9.2" y="3.5" width="2.8" height="9" rx=".8" fill="currentColor"/>',
  stop: '<rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/>',
  chev: '<path d="M4.5 6.5L8 10l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  search: '<circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  grid: '<path d="M2.5 5.5h11M2.5 10.5h11M5.5 2.5v11M10.5 2.5v11" stroke="currentColor" stroke-width="1.3"/>',
  layout: '<rect x="2" y="3" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="3" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="9.5" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 5h4M8 5v6.5h2" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  group: '<rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.5 2"/><rect x="5" y="5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  fit: '<path d="M2.5 6V3.5a1 1 0 0 1 1-1H6M10 2.5h2.5a1 1 0 0 1 1 1V6M13.5 10v2.5a1 1 0 0 1-1 1H10M6 13.5H3.5a1 1 0 0 1-1-1V10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  plus: '<path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  minus: '<path d="M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  sun: '<circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  help: '<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.3 6.3a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1v.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".8" fill="currentColor"/>',
  cursor: '<path d="M4 2.5l8 5-3.6 1 2 4-1.6.8-2-4L4 12z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
  hand: '<path d="M5.5 8V4a1 1 0 0 1 2 0v3.5M7.5 7V3a1 1 0 0 1 2 0v4M9.5 7V4a1 1 0 0 1 2 0v5.5c0 2.5-1.6 4-4 4-1.8 0-2.8-.8-3.8-2.3L2.5 8.6a1 1 0 0 1 1.6-1.2L5.5 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
  ok: '<path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  alert: '<path d="M8 2.5l6 10.5H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 7v2.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  panel: '<rect x="2" y="2.5" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.4"/>',
};
const ic = (n, s = 16) => `<svg class="ic" viewBox="0 0 16 16" width="${s}" height="${s}" aria-hidden="true">${I[n]}</svg>`;
const kv = { client: "client", lb: "lb", "web-server": "web", postgres: "pg" };

const brand = `<div class="brand"><span class="mark"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="4" cy="8" r="2" fill="var(--on-accent)"/><circle cx="12" cy="4" r="2" fill="var(--on-accent)"/><circle cx="12" cy="12" r="2" fill="var(--on-accent)"/><path d="M5.5 7.2L10.5 4.8M5.5 8.8l5 2.4" stroke="var(--on-accent)" stroke-width="1.4"/></svg></span>SD Lab</div>`;
const nav = `<nav class="nav" aria-label="Chính"><a href="#" aria-current="page">Lab</a><a href="#">Học</a><a href="#">Thử thách</a><a href="#">Bảng xếp hạng</a></nav>`;
const doc = `<div class="docname"><b>Cửa hàng trực tuyến</b><span class="saved">Đã lưu trên máy · 2 phút trước</span></div>`;
const undo = `<button class="u-btn" aria-label="Hoàn tác (⌘Z)">${ic("undo")}</button><button class="u-btn" aria-label="Làm lại (⇧⌘Z)" disabled>${ic("redo")}</button>`;
const problems = `<button class="problems">${ic("ok", 14)} Không có vấn đề</button>`;
const run = `<div class="run"><button class="go">${ic("play")} Chạy mô phỏng <span class="kbd">⌘↵</span></button><button class="more" aria-label="Thiết lập lần chạy">${ic("chev")}</button></div>
  <div class="running-ctl"><div class="prog"><div class="t"><span>Đang chạy</span><b class="num">4,2 / 10 giây</b></div><div class="track"><span></span></div></div><button class="stop">${ic("stop", 14)} Dừng</button></div>`;
const util = `<button class="u-btn" aria-label="Giao diện sáng/tối">${ic("sun")}</button><button class="u-btn util-x" aria-label="Ngôn ngữ">VI</button><button class="u-btn util-x" aria-label="Trợ giúp">${ic("help")}</button>`;

function palette(extra = "") {
  const item = (kind, price, sub) => `<div class="pitem" style="--k:var(--c-${SDData.kinds[kind].cat})" title="Kéo vào khung vẽ"><div class="tile">${SDArt.svg(kind, 32, 24)}</div><div><b>${SDData.kinds[kind].label}</b><small>${sub}</small></div><div class="price">${price}</div></div>`;
  const soon = (name, sub) => `<div class="pitem soon" style="--k:var(--down)"><div class="tile"></div><div><b>${name}</b><small>${sub}</small></div><div class="price">Sắp có</div></div>`;
  return `<aside class="palette ${extra}" aria-label="Thành phần">
    <div class="ph"><div class="search">${ic("search", 14)} Tìm thành phần <span class="kbd2">⌘K</span></div></div>
    <div class="pgroup"><h5>Chung</h5>${item("client", "0 $", "Nơi yêu cầu xuất phát")}${item("lb", "25 $", "Chia đều yêu cầu")}</div>
    <div class="pgroup"><h5>Tính toán</h5>${item("web-server", "23 $", "Chạy mã, trả lời HTTP")}</div>
    <div class="pgroup"><h5>Dữ liệu</h5>${item("postgres", "180 $", "CSDL quan hệ")}${soon("Bộ nhớ đệm", "Giảm tải đọc")}${soon("Hàng đợi", "Việc chạy nền")}</div>
    <div class="foot">Kéo vào khung vẽ, hoặc chọn rồi bấm Enter. Giá là mỗi máy mỗi tháng.</div>
  </aside>`;
}
function inspector(extra = "") {
  const spark = (pts, color) => `<svg viewBox="0 0 120 28" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
  return `<aside class="insp ${extra}" aria-label="Thuộc tính">
    <div class="ih" style="--k:var(--c-compute)"><div class="tile">${SDArt.svg("web-server", 34, 26)}</div><div><b>Máy chủ web 1</b><small>Máy chủ web · tính toán</small></div><button class="u-btn" aria-label="Thu gọn">${ic("panel")}</button></div>
    <div class="isec edit-only"><h6>Cấu hình</h6>
      <div class="two"><div class="f"><label>Số vCPU</label><div class="stp"><b>−</b><span>1</span><b>+</b></div></div><div class="f"><label>Bộ nhớ (GB)</label><div class="stp"><b>−</b><span>2</span><b>+</b></div></div></div>
      <div class="f"><label>Số bản sao</label><div class="stp"><b>−</b><span>2</span><b>+</b></div><span class="hint">Mỗi bản sao chịu khoảng 9.000 yêu cầu/giây với 1 vCPU.</span></div></div>
    <div class="isec edit-only"><h6>Chi phí mỗi tháng <span>ước tính</span></h6><div class="cost"><span class="v">45 $</span><span class="b">2 máy × 22,5 $</span></div></div>
    <div class="isec edit-only"><h6>Nâng cao <span>${ic("chev", 14)}</span></h6></div>
    <div class="isec run-only"><h6 class="big">Lần chạy này <span class="num">giây 4,2 / 10</span></h6>
      <div class="hot">${ic("alert", 16)} PostgreSQL 1 quá tải 120%, đang từ chối 2.000 yêu cầu/giây</div>
      <div class="metric"><span class="lbl">Độ trễ p95</span><span class="val bad">184 ms</span>${spark("0,24 20,22 40,23 60,18 80,9 100,6 120,4", "var(--over)")}</div>
      <div class="metric"><span class="lbl">Tỉ lệ trả lời được</span><span class="val warn">83,4%</span>${spark("0,3 20,3 40,4 60,9 80,14 100,15 120,16", "var(--busy-line)")}</div>
      <div class="metric"><span class="lbl">Thông lượng</span><span class="val">10.000/s</span>${spark("0,10 20,8 40,8 60,9 80,12 100,12 120,12", "var(--accent-text)")}</div>
      <div class="metric"><span class="lbl">Chi phí mỗi tháng</span><span class="val">430 $</span></div>
    </div>
  </aside>`;
}
const playback = `<div class="playback" aria-label="Phát lại">
  <button class="u-btn outline" aria-label="Tạm dừng">${ic("pause", 14)}</button>
  <span class="t">00:04,2</span>
  <div class="scrub"><span class="line"></span><span class="done"></span><span class="ev" style="left:30%" title="Máy chủ web 2 ngừng chạy">${ic("alert", 10)}</span><span class="ev" style="left:38%" title="PostgreSQL 1 quá tải">${ic("alert", 10)}</span></div>
  <span class="t">00:10,0</span><span class="speed"><span>0,5×</span><span class="on">1×</span><span>2×</span></span></div>`;
const legend = (pos) => `<div class="legend-chip" style="${pos}"><span><i style="border-color:var(--e-http)"></i>HTTP</span><span><i style="border-top-style:dashed;border-color:var(--e-db)"></i>Cơ sở dữ liệu</span></div>`;
const zoom = (pos) => `<div class="ctl-stack" style="${pos}"><button class="u-btn" aria-label="Thu nhỏ">${ic("minus")}</button><span class="z">75%</span><button class="u-btn" aria-label="Phóng to">${ic("plus")}</button><button class="u-btn" aria-label="Vừa màn hình">${ic("fit")}</button></div>`;
const status = `<div class="status"><span class="dotok">Bộ mô phỏng 0.1.0 sẵn sàng</span><span>5 thành phần · 5 kết nối</span><div class="r"><span class="num">430 $/tháng</span><span>Lưu tự động trên máy</span></div></div>`;

function layout(opt) {
  if (opt === "a") return `<header class="top">${brand}${nav}<div class="mid"><span class="sep"></span>${doc}<span style="flex:1"></span>${undo}<span class="sep"></span>${problems}</div>${util}${run}</header>
    ${palette()}<div class="cv" id="cv">${legend("left:16px;top:14px")}${zoom("right:16px;bottom:14px")}</div>${inspector()}${playback}${status}`;
  if (opt === "b") return `<header class="top">${brand}${nav}<span style="flex:1"></span>${util}</header>
    <div class="tool">${doc}<span class="sep"></span>${undo}<span class="sep"></span><button class="u-btn">${ic("grid")} Bám lưới</button><button class="u-btn">${ic("layout")} Sắp xếp gọn</button><button class="u-btn">${ic("group")} Gộp nhóm</button><span style="flex:1"></span>${problems}${run}</div>
    ${palette()}<div class="cv" id="cv">${legend("left:16px;bottom:14px")}${zoom("right:16px;bottom:14px")}</div>${inspector()}${playback}`;
  return `<header class="top">${brand}<span class="sep"></span><span style="color:var(--text-3)">Lab /</span>${doc}<span style="flex:1"></span>${problems}${util}${run}</header>
    <div class="cv" id="cv">${legend("left:50%;transform:translateX(-50%);top:14px")}</div>
    ${palette("float")}${inspector("float")}
    <div class="dock"><button class="u-btn on" aria-label="Chọn">${ic("cursor")}</button><button class="u-btn" aria-label="Kéo khung vẽ">${ic("hand")}</button><span class="sep"></span>${undo}<span class="sep"></span><button class="u-btn" aria-label="Thu nhỏ">${ic("minus")}</button><span class="z num" style="font-size:12px;color:var(--text-2);padding:0 4px">75%</span><button class="u-btn" aria-label="Phóng to">${ic("plus")}</button><button class="u-btn" aria-label="Vừa màn hình">${ic("fit")}</button><span class="sep"></span><button class="u-btn" aria-label="Sắp xếp gọn">${ic("layout")}</button></div>
    ${playback}`;
}

function draw(s) {
  const app = document.getElementById("app");
  app.className = "app L-" + s.option;
  app.innerHTML = layout(s.option);
  let style = "a"; try { style = localStorage.getItem("sd-demo-01-opt") || "a"; } catch {}
  const cv = document.getElementById("cv");
  const fit = document.createElement("div"); fit.className = "fit";
  const c = document.createElement("div"); c.className = "canvas"; fit.appendChild(c); cv.appendChild(fit);
  SDNodes.canvas(c, style, s.mode, { uid: "s", extra: s.mode === "editing" ? { "web-1": { selected: true } } : {} });
  requestAnimationFrame(() => {
    const W = parseFloat(c.style.width), H = parseFloat(c.style.height);
    let availW = cv.clientWidth, offX = 0;
    if (s.option === "c") { availW -= s.mode === "running" ? 420 : 620; offX = s.mode === "running" ? -128 : -40; }
    const k = Math.min(1, availW / W, (cv.clientHeight - 60) / H);
    fit.style.transform = `translate(calc(-50% + ${offX}px), -50%) scale(${k.toFixed(3)})`;
    document.querySelectorAll(".z").forEach((z) => (z.textContent = Math.round(k * 100) + "%"));
  });
}

Demo.init({
  id: "03", title: "03 · Khung ứng dụng và nút Chạy",
  options: [
    { id: "a", name: "Một thanh, một nút Chạy", recommended: true,
      summary: "Một thanh 56 px gom tất cả: logo, điều hướng, tên thiết kế + trạng thái lưu, hoàn tác/làm lại, số vấn đề và nút Chạy mô phỏng nổi bật ở góc phải. Công cụ hiếm dùng (bám lưới, sắp xếp, gộp nhóm) chuyển vào ⌘K và thanh nổi trên khung vẽ. Dải trạng thái 28 px ở đáy giữ thông tin bộ mô phỏng và tổng chi phí.",
      pros: ["Khung vẽ được thêm 40 px chiều cao so với hai thanh", "Chỉ một nút màu nhấn trên cả màn hình: mắt tìm ra Chạy ngay", "Khi chạy, chính nút Chạy biến thành tiến độ + Dừng, không nhảy chỗ"],
      cons: ["Thanh trên khá chật ở 1280 px (cần thu điều hướng thành biểu tượng)", "Công cụ bố cục khó tìm hơn với người mới"] },
    { id: "b", name: "Điều hướng + thanh công cụ",
      summary: "Thanh điều hướng 44 px riêng cho cả trang, bên dưới là thanh công cụ 48 px của thiết kế: tên, hoàn tác, bám lưới, sắp xếp, gộp nhóm, vấn đề và nút Chạy. Quen thuộc như Syscraft nhưng gọn và không bị tràn chữ.",
      pros: ["Mọi công cụ đều thấy được, có chữ đi kèm", "Tách rõ \"đang ở đâu\" và \"đang làm gì\"", "Dễ mở rộng thêm nút sau này"],
      cons: ["Tốn 92 px chiều cao cho khung", "Giống bố cục của Syscraft nên kém riêng"] },
    { id: "c", name: "Khung vẽ tràn màn, bảng nổi",
      summary: "Khung vẽ chiếm toàn bộ màn hình; bảng thành phần và thuộc tính nổi như tấm thẻ, thanh công cụ là một \"dock\" ở giữa đáy. Khi chạy, dock nhường chỗ cho thanh phát lại.",
      pros: ["Hiện đại, rộng rãi, giống Figma/tldraw", "Thiết kế lớn có tối đa chỗ trống"],
      cons: ["Bảng nổi che mất một phần sơ đồ", "Nhiều bóng đổ, nhiều lớp: khó giữ gọn gàng trên màn 1280 px", "Thông tin trạng thái không có chỗ cố định"] },
  ],
  onChange: draw,
});
addEventListener("resize", () => draw({ option: document.documentElement.dataset.option, mode: document.documentElement.dataset.mode }));
</script>
</body>
</html>
