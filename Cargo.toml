[workspace]
resolver = "3"
members = ["crates/sim-core", "crates/sim-cli", "crates/sim-wasm", "crates/content"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Optimized but quick to build: for CI jobs that run the engine (content validation) and are
# not benchmarks. Release keeps LTO for the shipped wasm/CLI.
[profile.ci]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = false
